name: Full AKS Setup and App Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ secrets.RESOURCE_GROUP }} --location ${{ secrets.AZURE_REGION }}

      - name: Create Azure Container Registry
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr create --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --name ${{ secrets.ACR_NAME }} \
              --sku Basic || echo "ACR already exists"

      - name: Build and Push Docker Image to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          docker build -t $ACR_NAME.azurecr.io/nginx-app:latest ./app
          docker push $ACR_NAME.azurecr.io/nginx-app:latest

      - name: Create AKS Cluster (if not exists)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az aks show --name ${{ secrets.AKS_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} || \
            az aks create --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --name ${{ secrets.AKS_NAME }} \
              --node-count 1 \
              --enable-addons monitoring \
              --attach-acr ${{ secrets.ACR_NAME }} \
              --generate-ssh-keys

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          cluster-name: ${{ secrets.AKS_NAME }}
          resource-group: ${{ secrets.RESOURCE_GROUP }}

      - name: Deploy App to AKS
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            ./manifests/deployment.yaml
            ./manifests/service.yaml
          images: |
            ${{ secrets.ACR_NAME }}.azurecr.io/nginx-app:latest
          namespace: default

      - name: Get External IP
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Waiting for external IP..."
            for i in {1..30}; do
              IP=$(kubectl get svc nginx-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "")
              if [ ! -z "$IP" ]; then
                echo "App available at: http://$IP"
                exit 0
              fi
              echo "Retrying in 10s..."
              sleep 10
            done
            echo "No IP found after 5 minutes"
